    <style>
        /* CSS Variables matching T-Pot Attack Map */
        :root {
            --primary-color: #e20074;
            --primary-hover: #c8006a;
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --bg-navbar: rgba(26, 26, 26, 0.95);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #808080;
            --border-primary: #333333;
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', 'Monaco', 'Menlo', monospace;
            --font-xs: 0.875rem;
            --font-sm: 1rem;
            --font-md: 1.125rem;
            --font-lg: 1.25rem;
            --font-xl: 1.5rem;
            --font-xxl: 1.875rem;
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --radius-md: 8px;
            --radius-round: 50%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            font-family: var(--font-primary);
            font-size: var(--font-sm);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border-primary);
            border-top: 3px solid var(--primary-color);
            border-radius: var(--radius-round);
            animation: spin 1s linear infinite;
            margin: 0 auto var(--spacing-lg);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-content h2 {
            font-size: var(--font-xxl);
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .loading-content p {
            color: var(--text-secondary);
        }

        /* Top Navigation Bar */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--bg-navbar);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-primary);
            z-index: 1000;
        }

        .navbar-content {
            height: 100%;
            padding: 0 var(--spacing-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .flex-center {
            display: flex;
            align-items: center;
        }

        .flex-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-brand {
            gap: var(--spacing-xs);
            font-size: var(--font-lg);
            font-weight: 600;
            color: var(--text-primary);
        }

        .navbar-brand i {
            color: var(--primary-color);
            font-size: var(--font-xl);
        }

        /* T-Pot Stats in Header */
        .navbar-stats {
            display: flex;
            align-items: center;
            flex: 1;
            justify-content: center;
        }

        .stats-group {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-sm) var(--spacing-lg);
            background: rgba(226, 0, 116, 0.1);
            border: 1px solid rgba(226, 0, 116, 0.3);
            border-radius: var(--radius-md);

        .stats-header-title {

            gap: var(--spacing-xs);

            color: var(--primary-color);

        .stats-inline {

        .stat-separator {

        .panel-content {

        .section-header {

        .badge-telnet { background: rgba(167, 139, 250, 0.2); color: #a78bfa; }
        .badge-rdp { background: rgba(255, 143, 171, 0.2); color: #ff8fab; }
        .badge-vnc { background: rgba(0, 0, 255, 0.2); color: #0000FF; }
        .badge-smb { background: rgba(156, 39, 176, 0.2); color: #9c27b0; }

        .attack-item strong {

        }

        .attack-item .time {

        /* Top Attackers */
        .top-attackers {

        .top-attacker-item {

        .top-attacker-item .count {

        /* Leaflet Popup Customization */
        .leaflet-popup-content-wrapper {
            background: rgba(26, 26, 26, 0.98);

            border: 1px solid var(--border-primary);

        /* Custom Scrollbar */
        .side-panel::-webkit-scrollbar {

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .side-panel {
                width: 300px;
            }
            
            .navbar-stats {
                display: none;

    <script>
        /**
         * T-Pot Attack Map Dashboard
         * Enhanced UI and data visualization functionality
         */

        /**
         * Attack Cache Manager
         * Handles persistent storage of attack events using IndexedDB with LocalStorage fallback
         */
        class AttackCache {
            constructor() {
                this.dbName = 'TPotAttackCache';
                this.storeName = 'attacks';
                this.version = 1;
                this.retentionPeriod = 24 * 60 * 60 * 1000; // 24 hours
                this.maxEvents = 10000; // Performance/memory limit
                this.cleanupInterval = 5 * 60 * 1000; // Cleanup every 5 minutes
                this.storageType = null;
                this.db = null;
                this.localStorageKey = 'tpot_attack_cache';
            }

            async init() {
                console.log('[CACHE] Initializing attack cache...');
                try {
                    await this.initIndexedDB();
                    this.storageType = 'indexeddb';
                    console.log('[CACHE] Using IndexedDB for storage');
                } catch (error) {
                    console.warn('[CACHE] IndexedDB failed, falling back to LocalStorage:', error);
                    this.initLocalStorage();
                    this.storageType = 'localstorage';
                    console.log('[CACHE] Using LocalStorage for storage');
                }

                // Start periodic cleanup
                setInterval(() => {
                    this.cleanup();
                }, this.cleanupInterval);

                console.log(`[CACHE] Cache initialized with ${this.storageType}, retention: 24h`);
            }

            async initIndexedDB() {
                return new Promise((resolve, reject) => {
                    if (!window.indexedDB) {
                        reject(new Error('IndexedDB not supported'));
                        return;
                    }

                    const request = indexedDB.open(this.dbName, this.version);
                    
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve();
                    };

                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        
                        // Create attacks object store if it doesn't exist
                        if (!db.objectStoreNames.contains(this.storeName)) {
                            const store = db.createObjectStore(this.storeName, { 
                                keyPath: 'id',
                                autoIncrement: true 
                            });
                            
                            // Create index on timestamp for efficient cleanup queries
                            store.createIndex('timestamp', 'timestamp', { unique: false });
                            store.createIndex('source_ip', 'src_ip', { unique: false });
                            store.createIndex('honeypot', 'honeypot', { unique: false });
                        }
                    };
                });
            }

            initLocalStorage() {
                // LocalStorage is synchronous, just verify it's available
                if (!window.localStorage) {
                    throw new Error('LocalStorage not supported');
                }
                
                // Initialize empty cache if doesn't exist
                if (!localStorage.getItem(this.localStorageKey)) {
                    const emptyCache = {
                        events: [],
                        lastCleanup: Date.now(),
                        version: 1
                    };
                    localStorage.setItem(this.localStorageKey, JSON.stringify(emptyCache));
                }
            }

            async storeEvent(event) {
                // Add timestamp and unique ID if not present
                const eventToStore = {
                    ...event,
                    timestamp: Date.now(),
                    cached_at: Date.now()
                };

                if (this.storageType === 'indexeddb') {
                    return this.storeInIndexedDB(eventToStore);
                } else {
                    return this.storeInLocalStorage(eventToStore);
                }
            }

            async storeInIndexedDB(event) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction([this.storeName], 'readwrite');
                    const store = transaction.objectStore(this.storeName);
                    const request = store.add(event);

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            storeInLocalStorage(event) {
                try {
                    const cache = JSON.parse(localStorage.getItem(this.localStorageKey));
                    cache.events.push(event);
                    
                    // Limit cache size
                    if (cache.events.length > this.maxEvents) {
                        cache.events = cache.events.slice(-this.maxEvents);
                    }
                    
                    localStorage.setItem(this.localStorageKey, JSON.stringify(cache));
                    return Promise.resolve();
                } catch (error) {
                    console.error('[CACHE] LocalStorage store failed:', error);
                    return Promise.reject(error);
                }
            }

            async getRecentEvents(limit = 100) {
                if (this.storageType === 'indexeddb') {
                    return this.getFromIndexedDB(limit);
                } else {
                    return this.getFromLocalStorage(limit);
                }
            }

            async getFromIndexedDB(limit) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction([this.storeName], 'readonly');
                    const store = transaction.objectStore(this.storeName);
                    const index = store.index('timestamp');
                    const request = index.openCursor(null, 'prev');
                    
                    const results = [];
                    request.onsuccess = (event) => {
                        const cursor = event.target.result;
                        if (cursor && results.length < limit) {
                            results.push(cursor.value);
                            cursor.continue();
                        } else {
                            resolve(results);
                        }
                    };
                    
                    request.onerror = () => reject(request.error);
                });
            }

            getFromLocalStorage(limit) {
                try {
                    const cache = JSON.parse(localStorage.getItem(this.localStorageKey));
                    return Promise.resolve(cache.events.slice(-limit).reverse());
                } catch (error) {
                    console.error('[CACHE] LocalStorage read failed:', error);
                    return Promise.resolve([]);
                }
            }

            async cleanup() {
                const cutoffTime = Date.now() - this.retentionPeriod;
                console.log(`[CACHE] Running cleanup, removing events older than ${new Date(cutoffTime).toISOString()}`);
                
                if (this.storageType === 'indexeddb') {
                    return this.cleanupIndexedDB(cutoffTime);
                } else {
                    return this.cleanupLocalStorage(cutoffTime);
                }
            }

            async cleanupIndexedDB(cutoffTime) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction([this.storeName], 'readwrite');
                    const store = transaction.objectStore(this.storeName);
                    const index = store.index('timestamp');
                    const range = IDBKeyRange.upperBound(cutoffTime);
                    const request = index.openCursor(range);
                    
                    let deletedCount = 0;
                    request.onsuccess = (event) => {
                        const cursor = event.target.result;
                        if (cursor) {
                            cursor.delete();
                            deletedCount++;
                            cursor.continue();
                        } else {
                            console.log(`[CACHE] Cleanup complete, deleted ${deletedCount} events`);
                            resolve(deletedCount);
                        }
                    };
                    
                    request.onerror = () => reject(request.error);
                });
            }

            cleanupLocalStorage(cutoffTime) {
                try {
                    const cache = JSON.parse(localStorage.getItem(this.localStorageKey));
                    const initialCount = cache.events.length;
                    cache.events = cache.events.filter(event => event.timestamp > cutoffTime);
                    cache.lastCleanup = Date.now();
                    localStorage.setItem(this.localStorageKey, JSON.stringify(cache));
                    
                    const deletedCount = initialCount - cache.events.length;
                    console.log(`[CACHE] Cleanup complete, deleted ${deletedCount} events`);
                    return Promise.resolve(deletedCount);
                } catch (error) {
                    console.error('[CACHE] LocalStorage cleanup failed:', error);
                    return Promise.reject(error);
                }
            }

            async clear() {
                console.log('[CACHE] Clearing all cached events');
                
                if (this.storageType === 'indexeddb') {
                    return new Promise((resolve, reject) => {
                        const transaction = this.db.transaction([this.storeName], 'readwrite');
                        const store = transaction.objectStore(this.storeName);
                        const request = store.clear();
                        
                        request.onsuccess = () => {
                            console.log('[CACHE] IndexedDB cleared');
                            resolve();
                        };
                        request.onerror = () => reject(request.error);
                    });
                } else {
                    const emptyCache = {
                        events: [],
                        lastCleanup: Date.now(),
                        version: 1
                    };
                    localStorage.setItem(this.localStorageKey, JSON.stringify(emptyCache));
                    console.log('[CACHE] LocalStorage cleared');
                    return Promise.resolve();
                }
            }
        }

        // Initialize cache
        const attackCache = new AttackCache();

        // Initialize Leaflet Map
        const map = L.map('map', {
            center: [20, 0],
            zoom: 2.5,
            minZoom: 2,
            maxZoom: 8,
            worldCopyJump: true
        });

        // Add CARTO Dark Theme Tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Layer groups for markers and lines
        const attackLines = L.layerGroup().addTo(map);
        const markers = L.layerGroup().addTo(map);

        // Mock data sources - Common attacker locations with ISO codes
        const attackSources = [
            { country: 'China', iso_code: 'CN', lat: 35.8617, lng: 104.1954, continent_code: 'AS' },
            { country: 'Russia', iso_code: 'RU', lat: 55.7558, lng: 37.6173, continent_code: 'EU' },
            { country: 'USA', iso_code: 'US', lat: 37.7749, lng: -122.4194, continent_code: 'NA' },
            { country: 'Brazil', iso_code: 'BR', lat: -23.5505, lng: -46.6333, continent_code: 'SA' },
            { country: 'India', iso_code: 'IN', lat: 28.6139, lng: 77.2090, continent_code: 'AS' },
            { country: 'Germany', iso_code: 'DE', lat: 52.5200, lng: 13.4050, continent_code: 'EU' },
            { country: 'United Kingdom', iso_code: 'GB', lat: 51.5074, lng: -0.1278, continent_code: 'EU' },
            { country: 'Japan', iso_code: 'JP', lat: 35.6762, lng: 139.6503, continent_code: 'AS' },
            { country: 'South Korea', iso_code: 'KR', lat: 37.5665, lng: 126.9780, continent_code: 'AS' },
            { country: 'Netherlands', iso_code: 'NL', lat: 52.3676, lng: 4.9041, continent_code: 'EU' },
            { country: 'Ukraine', iso_code: 'UA', lat: 50.4501, lng: 30.5234, continent_code: 'EU' },
            { country: 'Vietnam', iso_code: 'VN', lat: 21.0285, lng: 105.8542, continent_code: 'AS' },
            { country: 'Iran', iso_code: 'IR', lat: 35.6892, lng: 51.3890, continent_code: 'AS' },
            { country: 'Turkey', iso_code: 'TR', lat: 41.0082, lng: 28.9784, continent_code: 'AS' },
            { country: 'France', iso_code: 'FR', lat: 48.8566, lng: 2.3522, continent_code: 'EU' },
            { country: 'Poland', iso_code: 'PL', lat: 52.2297, lng: 21.0122, continent_code: 'EU' },
            { country: 'Romania', iso_code: 'RO', lat: 44.4268, lng: 26.1025, continent_code: 'EU' },
            { country: 'Mexico', iso_code: 'MX', lat: 19.4326, lng: -99.1332, continent_code: 'NA' },
            { country: 'Indonesia', iso_code: 'ID', lat: -6.2088, lng: 106.8456, continent_code: 'AS' },
            { country: 'Thailand', iso_code: 'TH', lat: 13.7563, lng: 100.5018, continent_code: 'AS' }
        ];

        // Destination honeypot locations (T-Pot instances)
        const honeypotLocations = [
            { lat: 50.1109, lng: 8.6821, country_name: 'Germany', iso_code: 'DE', hostname: 'finance' },
            { lat: 40.7128, lng: -74.0060, country_name: 'USA', iso_code: 'US', hostname: 'webapp' },
            { lat: 51.5074, lng: -0.1278, country_name: 'United Kingdom', iso_code: 'GB', hostname: 'research' }
        ];

        // Protocol and honeypot definitions matching T-Pot
        const protocols = [
            { name: 'SSH', port: 22, color: '#ff6b6b', class: 'ssh', honeypot: 'Cowrie' },
            { name: 'HTTP', port: 80, color: '#4dabf7', class: 'http', honeypot: 'Tanner' },
            { name: 'FTP', port: 21, color: '#ffd93d', class: 'ftp', honeypot: 'Heralding' },
            { name: 'Telnet', port: 23, color: '#a78bfa', class: 'telnet', honeypot: 'Cowrie' },
            { name: 'RDP', port: 3389, color: '#ff8fab', class: 'rdp', honeypot: 'RDPy' },
            { name: 'VNC', port: 5900, color: '#0000FF', class: 'vnc', honeypot: 'Heralding' },
            { name: 'SMB', port: 445, color: '#9c27b0', class: 'smb', honeypot: 'Dionaea' },
            { name: 'SIP', port: 5060, color: '#00bcd4', class: 'sip', honeypot: 'SentryPeer' }
        ];

        // IP reputation types
        const ipRepTypes = [
            'Reputation Unknown',
            'Known Scanner',
            'Known Attacker',
            'Tor Exit Node',
            'Suspicious Activity',
            'Botnet Member'
        ];

        // Statistics
        let stats = {
            '1m': 0,
            '1h': 0,
            '24h': 0
        };

        let attackHistory = [];
        let countryStats = {};
        let eventCounter = 1000;

        // Add honeypot markers
        honeypotLocations.forEach(location => {
            const marker = L.circleMarker([location.lat, location.lng], {
                radius: 8,
                fillColor: '#e20074',
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(markers);

            marker.bindPopup(`
                <div style="text-align: center; padding: 0.5rem;">
                    <strong style="color: #e20074; font-size: 1.1rem;">🛡️ T-Pot Honeypot</strong><br>
                    <span style="color: #b0b0b0; font-size: 0.85rem;">${location.hostname}<br>${location.country_name}</span>
                </div>
            `);
        });

        // Generate random IP address
        function generateIP() {
            return `${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;
        }

        // Format time to match T-Pot format
        function formatEventTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        // Format time for display
        function formatTime(dateString) {
            return dateString.split(' ')[1]; // Return just the time part
        }

        // Create attack animation
        function createAttackLine(srcLat, srcLng, dstLat, dstLng, color) {
            // Create curved line using D3
            const svg = d3.select(map.getPanes().overlayPane).append("svg")
                .attr("class", "attack-line-svg")
                .style("position", "absolute")
                .style("top", "0")
                .style("left", "0")
                .style("width", "100%")
                .style("height", "100%")
                .style("pointer-events", "none");

            const sourcePoint = map.latLngToLayerPoint([srcLat, srcLng]);
            const destPoint = map.latLngToLayerPoint([dstLat, dstLng]);

            // Create curved path
            const path = svg.append("path")
                .attr("d", `M ${sourcePoint.x},${sourcePoint.y} Q ${(sourcePoint.x + destPoint.x) / 2},${Math.min(sourcePoint.y, destPoint.y) - 100} ${destPoint.x},${destPoint.y}`)
                .attr("stroke", color)
                .attr("stroke-width", 2)
                .attr("fill", "none")
                .attr("opacity", 0.8)
                .attr("stroke-dasharray", "1000")
                .attr("stroke-dashoffset", "1000");

            // Animate the line
            path.transition()
                .duration(1000)
                .attr("stroke-dashoffset", 0)
                .on("end", function() {
                    // Fade out after animation
                    d3.select(this).transition()
                        .delay(1000)
                        .duration(500)
                        .attr("opacity", 0)
                        .remove();
                });

            // Remove SVG after animation
            setTimeout(() => {
                svg.remove();
            }, 2500);

            // Add source marker
            const sourceMarker = L.circleMarker([srcLat, srcLng], {
                radius: 5,
                fillColor: color,
                color: '#fff',
                weight: 1,
                opacity: 0.8,
                fillOpacity: 0.6
            }).addTo(markers);

            sourceMarker.bindPopup(`
                <div style="padding: 0.5rem;">
                    <strong style="color: ${color};">⚠️ Attack Source</strong><br>
                    <span style="color: #b0b0b0; font-size: 0.85rem;">
                        Location: ${srcLat.toFixed(4)}, ${srcLng.toFixed(4)}
                    </span>
                </div>
            `);

            // Remove marker after a while
            setTimeout(() => {
                markers.removeLayer(sourceMarker);
            }, 5000);
        }

        // Simulate attack event using T-Pot webhook data structure
        function simulateAttack() {
            const source = attackSources[Math.floor(Math.random() * attackSources.length)];
            const protocol = protocols[Math.floor(Math.random() * protocols.length)];
            const destination = honeypotLocations[Math.floor(Math.random() * honeypotLocations.length)];
            const ipRep = ipRepTypes[Math.floor(Math.random() * ipRepTypes.length)];

            // Create webhook data matching T-Pot format
            const webhookData = {
                protocol: protocol.name,
                color: protocol.color,
                iso_code: source.iso_code,
                honeypot: protocol.honeypot,
                src_port: Math.floor(Math.random() * 50000) + 10000,
                event_time: formatEventTime(),
                src_lat: source.lat,
                src_ip: generateIP(),
                ip_rep: ipRep,
                type: 'Traffic',
                dst_long: destination.lng,
                continent_code: source.continent_code,
                dst_lat: destination.lat,
                event_count: ++eventCounter,
                country: source.country,
                src_long: source.lng,
                dst_port: protocol.port,
                dst_ip: generateIP(),
                dst_iso_code: destination.iso_code,
                dst_country_name: destination.country_name,
                tpot_hostname: destination.hostname
            };

            // Log webhook data to console for demo purposes
            console.log('📡 Webhook Data:', webhookData);

            // Store in cache
            attackCache.storeEvent(webhookData).catch(error => {
                console.error('[CACHE] Failed to store event:', error);
            });

            // Update statistics
            stats['1m']++;
            stats['1h']++;
            stats['24h']++;
            
            // Update country statistics
            if (!countryStats[source.country]) {
                countryStats[source.country] = 0;
            }
            countryStats[source.country]++;

            // Update UI
            updateStats();
            addAttackToList(webhookData, protocol);
            updateTopAttackers();

            // Create visual attack line animation
            createAttackLine(webhookData.src_lat, webhookData.src_long, webhookData.dst_lat, webhookData.dst_long, webhookData.color);

            // Store in history
            attackHistory.push(webhookData);
            if (attackHistory.length > 100) {
                attackHistory.shift();
            }
        }

        // Update statistics display
        function updateStats() {
            document.getElementById('last_1m').textContent = stats['1m'];
            document.getElementById('last_1h').textContent = stats['1h'];
            document.getElementById('last_24h').textContent = stats['24h'];
        }

        // Add attack to sidebar list
        function addAttackToList(webhookData, protocol) {
            const list = document.getElementById('attack-list');
            const item = document.createElement('li');
            item.className = `attack-item ${protocol.class}`;
            item.innerHTML = `
                <span class="protocol-badge badge-${protocol.class}">${webhookData.protocol}</span><br>
                <strong>${webhookData.country}</strong> → ${webhookData.tpot_hostname}<br>
                <small>
                    ${webhookData.src_ip}:${webhookData.src_port} → ${webhookData.dst_ip}:${webhookData.dst_port}<br>
                    Honeypot: ${webhookData.honeypot} | ${webhookData.ip_rep}
                </small>
                <span class="time">${formatTime(webhookData.event_time)} | Event #${webhookData.event_count}</span>
            `;
            
            list.insertBefore(item, list.firstChild);
            
            // Keep only last 20 attacks
            while (list.children.length > 20) {
                list.removeChild(list.lastChild);
            }
        }

        // Update top attackers list
        function updateTopAttackers() {
            const sorted = Object.entries(countryStats)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const container = document.getElementById('top-attackers-list');
            container.innerHTML = sorted.map(([country, count]) => `
                <div class="top-attacker-item">
                    <span class="country">${country}</span>
                    <span class="count">${count}</span>
                </div>
            `).join('');
        }

        // Reset 1-minute counter
        setInterval(() => {
            stats['1m'] = 0;
            updateStats();
        }, 60000);

        // Reset 1-hour counter
        setInterval(() => {
            stats['1h'] = 0;
            updateStats();
        }, 3600000);

        // Simulate attacks at random intervals
        function startAttackSimulation() {
            simulateAttack();
            
            // Random interval between 1-5 seconds
            const nextInterval = 1000 + Math.random() * 4000;
            setTimeout(startAttackSimulation, nextInterval);
        }

        // Start the simulation after page load
        setTimeout(async () => {
            // Hide loading screen
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.classList.add('hidden');
            
            console.log('🎯 T-Pot Attack Map Demo Started');
            console.log('📊 Simulating honeypot attacks with mock data');
            console.log('🗺️  Using Leaflet.js for mapping');
            console.log('📈 Using D3.js for attack line animations');
            console.log('💾 Initializing attack cache...');
            
            // Initialize attack cache
            try {
                await attackCache.init();
                
                // Try to restore recent cached events
                const cachedEvents = await attackCache.getRecentEvents(20);
                if (cachedEvents.length > 0) {
                    console.log(`[CACHE] Restored ${cachedEvents.length} cached events`);
                    // Display cached events in the sidebar
                    cachedEvents.forEach(event => {
                        const protocol = protocols.find(p => p.name === event.protocol) || protocols[0];
                        addAttackToList(event, protocol);
                        
                        // Update country stats from cache
                        if (!countryStats[event.country]) {
                            countryStats[event.country] = 0;
                        }
                        countryStats[event.country]++;
                    });
                    updateTopAttackers();
                }
            } catch (error) {
                console.error('[CACHE] Failed to initialize:', error);
            }
            
            console.log('');
            console.log('This demo simulates WebSocket data that would normally come from:');
            console.log('  Honeypots → Elasticsearch → DataServer → Redis → AttackMapServer → Browser');
            console.log('📡 Attack events are cached in IndexedDB/LocalStorage for 24 hours');
            console.log('🔄 Cache cleanup runs every 5 minutes');
            
            startAttackSimulation();
        }, 2000);

        // Handle map resize
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
    </script>
</body>
</html>
